name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install Deps
        run: bun ci
      - name: Lint
        run: bun lint:ci
      - name: Typecheck
        run: bun typecheck
      - name: Build
        run: NEXT_PUBLIC_BASE_URL="http://localhost:3000" bun run build
